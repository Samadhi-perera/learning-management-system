<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="lmsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="50%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Crest -->
    <rect width="64" height="64" rx="16" fill="url(#lmsGradient)" />
    
    <!-- Inner Border for Premium Look -->
    <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- Academic Graduation Cap (Mortarboard) -->
    <g filter="url(#glow)">
        <!-- Cap Top Diamond -->
        <polygon points="32,15 10,26 32,37 54,26" fill="#ffffff" />
        
        <!-- Cap Skull Base -->
        <path d="M18,30.5 V40 C18,44.5 24,48 32,48 C40,48 46,44.5 46,40 V30.5 C42.5,33 37.5,34.5 32,34.5 C26.5,34.5 21.5,33 18,30.5 Z" fill="#e0e7ff" />
        
        <!-- Tassel String & Bobble -->
        <path d="M48,29 V43 C48,44.5 46.5,45.5 45,45.5" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="45" cy="47" r="2.5" fill="#facc15" />
        <circle cx="32" cy="26" r="2" fill="#e0e7ff" />
    </g>
</svg>
